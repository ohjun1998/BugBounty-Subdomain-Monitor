name: Public BugBounty Subdomain Monitor

on:
  schedule:
    - cron: '17 3,9 * * *'
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Public Logic Repository
      uses: actions/checkout@v4

    - name: Checkout Private Data Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.PRIVATE_DATA_REPO }}
        token: ${{ secrets.PRIVATE_REPO_PAT }}
        path: ./data-repo

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Cache Go Binaries
      id: cache-go
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('.github/workflows/recon.yml') }}

    - name: Install Tools
      if: steps.cache-go.outputs.cache-hit != 'true'
      run: |
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/anew@latest
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/projectdiscovery/katana/cmd/katana@latest
        go install -v github.com/tomnomnom/waybackurls@latest

    - name: Run Recon Pipeline
      env:
        DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
        TARGET_LIST: ${{ secrets.TARGET_DOMAINS }}
      run: |
        set +e
        
        # 1. Secret에서 타겟 불러오기 (최상위 경로에 생성)
        echo "$TARGET_LIST" > targets.txt
        if [ ! -s "targets.txt" ]; then
          echo "example.com" > targets.txt
        fi

        # 2. Private 리포지토리 폴더로 이동하여 작업 시작
        cd ./data-repo
        if [ ! -f "domains_old.txt" ]; then touch domains_old.txt; fi
        if [ ! -f "urls_old.txt" ]; then touch urls_old.txt; fi
        
        # 임시 작업 파일 생성
        touch raw_patch.txt all_passive_urls.txt filtered_urls.txt total_scan_list.txt live_results.txt raw_urls_patch.txt

        # 1. 서브도메인 수집 (상위 폴더의 targets.txt 참조)
        echo "[+] 서브도메인 및 패시브 URL 수집 중..."
        subfinder -dL ../targets.txt -silent | anew domains_old.txt > raw_patch.txt
        
        # 2. 분석 진입
        if [ -s raw_patch.txt ]; then
          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            timeout 45s katana -u "$root" -passive -automatic-scoping -silent -field url >> all_passive_urls.txt 2>/dev/null &
            timeout 45s sh -c "echo '$root' | waybackurls" >> all_passive_urls.txt 2>/dev/null &
          done < ../targets.txt
          wait 

          if [ -s all_passive_urls.txt ]; then
            grep -Ei "\.(env|log|bak|sql|ini|git|conf|zip|tar|gz|yaml|yml|old|bkp|pwd)$|dashboard|admin|login|portal|config|swagger|api-docs|index-of" all_passive_urls.txt \
              | grep -Eiv "\.(png|jpg|jpeg|gif|css|js|woff|woff2|svg|ico|font)$" \
              | anew urls_old.txt > raw_urls_patch.txt
          fi

          # 3. httpx 검증
          echo "[+] 수집된 모든 자산 실시간 응답 코드 확인 중 (Batch)..."
          cat raw_patch.txt > total_scan_list.txt
          if [ -s raw_urls_patch.txt ]; then
            cat raw_urls_patch.txt >> total_scan_list.txt
          fi
          sort -u total_scan_list.txt -o total_scan_list.txt

          if [ -s total_scan_list.txt ]; then
            cat total_scan_list.txt | httpx -sc -silent -t 200 -timeout 2 -retries 0 -no-color > live_results.txt
          fi

          # 4. 신규 자산 리포트 조립
          REPORT_FILE="New_Subdomains_Report.txt"
          echo "==================================================" > $REPORT_FILE
          echo "🔥 🚀 [NEW] 신규 발견 자산 탐지 리포트 🚀 🔥" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          echo "📅 스캔 완료 일시: $(date)" >> $REPORT_FILE
          echo "--------------------------------------------------" >> $REPORT_FILE

          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            touch temp_subs.txt
            grep -E "\.${root}$|^${root}$" raw_patch.txt | sort > temp_subs.txt
            
            if [ -s temp_subs.txt ]; then
              echo "" >> $REPORT_FILE
              echo "📂 [Root Target: $root]" >> $REPORT_FILE
              echo "--------------------------------------------------" >> $REPORT_FILE
              
              while read -r sub; do
                sub=$(echo "$sub" | xargs)
                [ -z "$sub" ] && continue

                RES=$(grep -i "^http.*$sub" live_results.txt | head -n 1)
                if [ -z "$RES" ]; then
                  echo "  🌐 $sub ➔ [❌ No Response]" >> $REPORT_FILE
                else
                  echo "  🌐 $RES" >> $REPORT_FILE
                fi
                
                if [ -s raw_urls_patch.txt ]; then
                  grep -i "$sub" raw_urls_patch.txt | sort -u | while read -r d_url; do
                    D_RES=$(grep -iF "$d_url" live_results.txt | head -n 1)
                    [ -n "$D_RES" ] && echo "     ↳ 🔑 [Sensitive Endpoint] $D_RES" >> $REPORT_FILE
                  done
                fi
              done < temp_subs.txt
            fi
            rm -f temp_subs.txt
          done < ../targets.txt

          # 5. 누적 종합 자산 히스토리 파일 조립 (전체 로직 복구 완료)
          HISTORY_FILE="All_Subdomains_History.txt"
          echo "==================================================" > $HISTORY_FILE
          echo "🗂️  [ARCHIVE] 종합 자산 누적 마스터 히스토리  🗂️" >> $HISTORY_FILE
          echo "==================================================" >> $HISTORY_FILE
          echo "⏱️  최종 동기화 시점 : $(date)" >> $HISTORY_FILE
          echo "📊  누적 서브도메인  : $(wc -l < domains_old.txt | xargs) 개" >> $HISTORY_FILE
          echo "📊  누적 민감 URL    : $(wc -l < urls_old.txt | xargs) 개" >> $HISTORY_FILE
          echo "--------------------------------------------------" >> $HISTORY_FILE
          echo "" >> $HISTORY_FILE
          
          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            echo "📁 [TARGET SCOPE] ➔ $root" >> $HISTORY_FILE
            echo "================================================--" >> $HISTORY_FILE
            
            echo "  🔹 [Subdomains]" >> $HISTORY_FILE
            grep -E "\.${root}$|^${root}$" domains_old.txt | sort -u | sed 's/^/    ↳ /' >> $HISTORY_FILE
            
            echo "" >> $HISTORY_FILE
            echo "  🔹 [Passive URLs History (Google Dork / Wayback)]" >> $HISTORY_FILE
            if [ -s urls_old.txt ]; then
              grep -i "$root" urls_old.txt | sort -u | sed 's/^/    ↳ ⏳ /' >> $HISTORY_FILE
            else
              echo "    (누적된 내역 없음)" >> $HISTORY_FILE
            fi
            echo "" >> $HISTORY_FILE
            echo "--------------------------------------------------" >> $HISTORY_FILE
            echo "" >> $HISTORY_FILE
          done < ../targets.txt

          # 디스코드 파일 전송
          curl -H "Content-Type: multipart/form-data" \
               -F "content=🔥 **[Subdomain Monitor]** 스캔 완료! 신규 자산 리포트 및 마스터 히스토리를 첨부합니다." \
               -F "file1=@./$REPORT_FILE" \
               -F "file2=@./$HISTORY_FILE" \
               "$DISCORD_URL" || true
               
          rm -f $HISTORY_FILE
        else
          echo "[-] 새로 발견된 서브도메인이 없습니다."
          SUB_COUNT=$(wc -l < domains_old.txt | xargs)
          URL_COUNT=$(wc -l < urls_old.txt | xargs)
          
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"🔍 **[Subdomain Monitor]** 정기 스캔 완료.\n🟢 새로운 자산이 발견되지 않았습니다.\n📊 **[현재 누적 관리 자산 풀]** 서브도메인: **${SUB_COUNT}개** | 민감 URL: **${URL_COUNT}개**\"}" \
               "$DISCORD_URL" || true
        fi

        # 잔여 파일 정리 (데이터 레포지토리 내의 임시파일과 부모 폴더의 타겟 파일 삭제)
        rm -f raw_patch.txt all_passive_urls.txt filtered_urls.txt total_scan_list.txt live_results.txt temp_subs.txt New_Subdomains_Report.txt raw_urls_patch.txt ../targets.txt || true

    - name: Commit & Push to Private Repo
      run: |
        cd ./data-repo
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add domains_old.txt urls_old.txt
        git commit -m "Update domains and urls archive [skip ci]" || echo "No changes to commit"
        git push || echo "Git push failed"
