name: BugBounty Subdomain Monitor

on:
  schedule:
    - cron: '0 */12 * * *' # 12시간마다 자동으로 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Cache Go Binaries
      id: cache-go
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('.github/workflows/recon.yml') }}

    - name: Install Tools
      if: steps.cache-go.outputs.cache-hit != 'true'
      run: |
        echo "[+] 캐시를 찾지 못해 툴을 새로 설치합니다."
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/anew@latest
        go install -v github.com/projectdiscovery/notify/cmd/notify@latest

    - name: Run Recon Pipeline
      env:
        NOTIFY_CONFIG: ${{ secrets.NOTIFY_SECRET }}
      run: |
        mkdir -p ~/.config/notify
        echo "$NOTIFY_CONFIG" > ~/.config/notify/provider-config.yaml
        
        if [ ! -f "targets.txt" ]; then
          echo "target.com" > targets.txt
        fi
        
        # [핵심 수정 부] 
        # 1. 속도 옵션을 추가하고(-t 100 -timeout 5), 결과를 알림으로 바로 쏘지 않고 'patch.txt' 파일에 임시 저장합니다.
        subfinder -dL targets.txt -t 100 -timeout 5 -silent | anew domains_old.txt > patch.txt
        
        # 2. 만약 patch.txt 파일 크기가 0보다 크다면 (신규 자산이 있다면)
        if [ -s patch.txt ]; then
          echo "[+] 신규 서브도메인 발견! 하나의 메시지로 묶어서 전송합니다."
          
          # 파일 내용을 통째로 읽어 notify에 던짐으로써 디스코드가 글자 수 한도 내에서 한 번에 벌크로 보여줍니다.
          cat patch.txt | notify -silent
        else
          echo "[-] 새로 발견된 서브도메인이 없습니다."
          echo "🔍 **[Subdomain Monitor]** 새로운 서브도메인이 발견되지 않았습니다. (정상 작동 중)" | notify -silent
        fi
        
        # 사용 완료한 임시 파일 삭제
        rm -f patch.txt
        
    - name: Commit & Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add domains_old.txt
        git commit -m "Update domains_old.txt [skip ci]" || echo "No changes to commit"
        git push
