name: BugBounty Subdomain Monitor

on:
  schedule:
    - cron: '0 3,9 * * *'
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Cache Go Binaries
      id: cache-go
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('.github/workflows/recon.yml') }}

    - name: Install Tools
      if: steps.cache-go.outputs.cache-hit != 'true'
      run: |
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/anew@latest
        go install -v github.com/projectdiscovery/notify/cmd/notify@latest
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/projectdiscovery/katana/cmd/katana@latest
        go install -v github.com/tomnomnom/waybackurls@latest

    - name: Run Recon Pipeline
      env:
        NOTIFY_CONFIG: ${{ secrets.NOTIFY_SECRET }}
        DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        mkdir -p ~/.config/notify
        echo "$NOTIFY_CONFIG" > ~/.config/notify/provider-config.yaml
        
        if [ ! -f "targets.txt" ] || [ ! -s "targets.txt" ]; then
          echo "target.com" > targets.txt
        fi
        if [ ! -f "domains_old.txt" ]; then
          touch domains_old.txt
        fi

        touch raw_patch.txt all_passive_urls.txt filtered_urls.txt total_scan_list.txt live_results.txt

        # 1. 서브도메인 수집
        echo "[+] 서브도메인 및 패시브 URL 수집 중..."
        (subfinder -dL targets.txt -silent || true) | (anew domains_old.txt > raw_patch.txt || true)
        
        # 2. 분석 진입
        if [ -s raw_patch.txt ]; then
          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            timeout 45s katana -u "$root" -passive -automatic-scoping -silent -field url >> all_passive_urls.txt 2>/dev/null &
            timeout 45s sh -c "echo '$root' | waybackurls" >> all_passive_urls.txt 2>/dev/null &
          done < targets.txt
          wait 

          if [ -s all_passive_urls.txt ]; then
            grep -Ei "\.(env|log|bak|sql|ini|git|conf|zip|tar|gz|yaml|yml|old|bkp|pwd)$|dashboard|admin|login|portal|config|swagger|api-docs|index-of" all_passive_urls.txt \
              | grep -Eiv "\.(png|jpg|jpeg|gif|css|js|woff|woff2|svg|ico|font)$" \
              | sort -u > filtered_urls.txt || true
          fi

          # 3. httpx 검증
          echo "[+] 수집된 모든 자산 실시간 응답 코드 확인 중 (Batch)..."
          cat raw_patch.txt > total_scan_list.txt
          if [ -s filtered_urls.txt ]; then
            cat filtered_urls.txt >> total_scan_list.txt
          fi
          sort -u total_scan_list.txt -o total_scan_list.txt

          if [ -s total_scan_list.txt ]; then
            cat total_scan_list.txt | httpx -sc -silent -t 200 -timeout 2 -retries 0 -no-color > live_results.txt || true
          fi

          # 4. 리포트 조립
          REPORT_FILE="New_Subdomains_Report.txt"
          echo "========= 🚀 종합 자산 식별 리포트 =========" > $REPORT_FILE
          echo "스캔 일시: $(date)" >> $REPORT_FILE
          echo "============================================" >> $REPORT_FILE

          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            touch temp_subs.txt
            grep -E "\.${root}$|^${root}$" raw_patch.txt | sort > temp_subs.txt || true
            
            if [ -s temp_subs.txt ]; then
              echo "" >> $REPORT_FILE
              echo "📌 [Root: $root]" >> $REPORT_FILE
              echo "--------------------------------------------" >> $REPORT_FILE
              
              while read -r sub; do
                sub=$(echo "$sub" | xargs)
                [ -z "$sub" ] && continue

                RES=""
                if [ -s live_results.txt ]; then
                  RES=$(grep -i "^http.*$sub" live_results.txt | head -n 1 || true)
                fi

                if [ -z "$RES" ]; then
                  echo "🌐 $sub [No Response]" >> $REPORT_FILE
                else
                  echo "🌐 $RES" >> $REPORT_FILE
                fi
                
                if [ -s filtered_urls.txt ]; then
                  grep -i "$sub" filtered_urls.txt | sort -u | while read -r d_url; do
                    D_RES=""
                    if [ -s live_results.txt ]; then
                      D_RES=$(grep -iF "$d_url" live_results.txt | head -n 1 || true)
                    fi
                    [ -n "$D_RES" ] && echo "   ↳ 🔍 Found: $D_RES" >> $REPORT_FILE
                  done
                fi
              done < temp_subs.txt
            fi
            rm -f temp_subs.txt
          done < targets.txt

          # [에러 방지 패치] 디스코드 주소가 잘못되었거나 통신장애가 나도 무조건 정상 패스 처리 (|| true)
          curl -H "Content-Type: multipart/form-data" \
               -F "content=🔥 **[Subdomain Monitor]** 초고속 최적화 스캔 완료! 새로운 취약성 자산이 발견되었습니다." \
               -F "file=@./$REPORT_FILE" \
               "$DISCORD_URL" || echo "Discord Send Failed"
        else
          echo "[-] 새로 발견된 서브도메인이 없습니다."
          echo "🔍 **[Subdomain Monitor]** 새로운 서브도메인이 발견되지 않았습니다. (정상 작동 중)" | notify -silent || true
        fi

        rm -f raw_patch.txt all_passive_urls.txt filtered_urls.txt total_scan_list.txt live_results.txt temp_subs.txt New_Subdomains_Report.txt || true

    # [에러 방지 패치] Git 커밋 과정에서 "No changes" 등으로 에러가 나더라도 Actions 단계 자체는 성공으로 끝마침
    - name: Commit & Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add domains_old.txt
        git commit -m "Update domains [skip ci]" || echo "No changes to commit"
        git push || echo "Git push failed"
