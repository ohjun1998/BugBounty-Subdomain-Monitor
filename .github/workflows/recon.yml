name: BugBounty Subdomain Monitor

on:
  schedule:
    - cron: '0 3,9 * * *'
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Cache Go Binaries
      id: cache-go
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('.github/workflows/recon.yml') }}

    - name: Install Tools
      if: steps.cache-go.outputs.cache-hit != 'true'
      run: |
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/anew@latest
        go install -v github.com/projectdiscovery/notify/cmd/notify@latest
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/projectdiscovery/katana/cmd/katana@latest
        go install -v github.com/tomnomnom/waybackurls@latest

    - name: Run Recon Pipeline
      env:
        NOTIFY_CONFIG: ${{ secrets.NOTIFY_SECRET }}
        DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        mkdir -p ~/.config/notify
        echo "$NOTIFY_CONFIG" > ~/.config/notify/provider-config.yaml
        [ ! -s "targets.txt" ] && echo "naver.com" > targets.txt

        # 1. [PASSIVE] 모든 소스에서 서브도메인 및 URL 일괄 수집 (초고속)
        echo "[+] 서브도메인 및 패시브 URL 수집 중..."
        subfinder -dL targets.txt -silent | anew domains_old.txt > raw_patch.txt
        
        if [ -s raw_patch.txt ]; then
          # 모든 루트 도메인에 대해 Katana/Wayback 결과 미리 모으기
          touch all_passive_urls.txt
          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            # Katana & Wayback 병렬 수집 및 필터링
            katana -u "$root" -passive -silent -field url >> all_passive_urls.txt &
            echo "$root" | waybackurls >> all_passive_urls.txt &
          done < targets.txt
          wait # 모든 패시브 수집 완료 대기

          # 민감 확장자 필터링 및 노이즈 제거 (일괄 처리)
          grep -Ei "\.(env|log|bak|sql|ini|git|conf|zip|tar|gz|yaml|yml|old|bkp|pwd)$|dashboard|admin|login|portal|config|swagger|api-docs|index-of" all_passive_urls.txt \
            | grep -Eiv "\.(png|jpg|jpeg|gif|css|js|woff|woff2|svg|ico|font)$" \
            | sort -u > filtered_urls.txt || true

          # 2. [BATCH CHECK] httpx 단 한 번만 실행 (속도의 핵심)
          echo "[+] 수집된 모든 자산 실시간 응답 코드 확인 중 (Batch)..."
          cat raw_patch.txt filtered_urls.txt | sort -u > total_scan_list.txt
          # 스레드 200개, 타임아웃 2초로 극강의 속도 발휘
          cat total_scan_list.txt | httpx -sc -silent -t 200 -timeout 2 -retries 0 -no-color > live_results.txt || true

          # 3. [REPORTING] 결과 조립 (매칭)
          REPORT_FILE="New_Subdomains_Report.txt"
          echo "========= 🚀 종합 자산 식별 리포트 =========" > $REPORT_FILE
          echo "스캔 일시: $(date)" >> $REPORT_FILE
          echo "============================================" >> $REPORT_FILE

          while read -r root; do
            root=$(echo "$root" | xargs)
            [ -z "$root" ] && continue
            
            # 현재 루트 도메인에 속하는 서브도메인만 추출
            grep -E "\.${root}$|^${root}$" raw_patch.txt | sort > temp_subs.txt || true
            
            if [ -s temp_subs.txt ]; then
              echo "" >> $REPORT_FILE
              echo "📌 [Root: $root]" >> $REPORT_FILE
              echo "--------------------------------------------" >> $REPORT_FILE
              
              while read -r sub; do
                # 미리 만들어둔 live_results.txt에서 결과값만 쏙 뽑아옴 (네트워크 요청 없음)
                RES=$(grep -i "^http.*$sub" live_results.txt | head -n 1)
                if [ -z "$RES" ]; then
                  echo "🌐 $sub [No Response]" >> $REPORT_FILE
                else
                  echo "🌐 $RES" >> $REPORT_FILE
                fi
                
                # 해당 서브도메인의 Dork/Wayback 결과 매칭
                grep -i "$sub" filtered_urls.txt | sort -u | while read -r d_url; do
                  D_RES=$(grep -iF "$d_url" live_results.txt | head -n 1)
                  [ -n "$D_RES" ] && echo "   ↳ 🔍 Found: $D_RES" >> $REPORT_FILE
                done
              done < temp_subs.txt
            fi
          done < targets.txt

          # 4. 전송
          curl -H "Content-Type: multipart/form-data" \
               -F "content=🔥 **[Subdomain Monitor]** 초고속 최적화 스캔 완료!" \
               -F "file=@./$REPORT_FILE" \
               "$DISCORD_URL"
        else
          echo "🔍 새로운 서브도메인이 없습니다." | notify -silent
        fi

        # 청소
        rm -f raw_patch.txt all_passive_urls.txt filtered_urls.txt total_scan_list.txt live_results.txt temp_subs.txt $REPORT_FILE || true

    - name: Commit & Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add domains_old.txt
        git commit -m "Update domains [skip ci]" || echo "No changes"
        git push
