name: BugBounty Subdomain Monitor

on:
  schedule:
    - cron: '0 3,9 * * *' # 매일 12시, 18시(한국 시간)에 자동으로 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Cache Go Binaries
      id: cache-go
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-bin-${{ hashFiles('.github/workflows/recon.yml') }}

    - name: Install Tools
      if: steps.cache-go.outputs.cache-hit != 'true'
      run: |
        echo "[+] 캐시를 찾지 못해 툴을 새로 설치합니다."
        go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
        go install -v github.com/tomnomnom/anew@latest
        go install -v github.com/projectdiscovery/notify/cmd/notify@latest
        go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
        go install -v github.com/projectdiscovery/katana/cmd/katana@latest
        go install -v github.com/tomnomnom/waybackurls@latest

    - name: Run Recon Pipeline
      env:
        NOTIFY_CONFIG: ${{ secrets.NOTIFY_SECRET }}
        DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        mkdir -p ~/.config/notify
        echo "$NOTIFY_CONFIG" > ~/.config/notify/provider-config.yaml
        
        if [ ! -f "targets.txt" ] || [ ! -s "targets.txt" ]; then
          echo "target.com" > targets.txt
        fi
        
        # 임시 파일 초기화 생성 (에러 방지용)
        touch raw_patch.txt temp_group.txt temp_all_dorks.txt temp_all_wayback.txt
        
        # 1. 신규 서브도메인 수집
        subfinder -dL targets.txt -t 100 -timeout 5 -silent | anew domains_old.txt > raw_patch.txt
        
        # 2. 신규 자산 정밀 분석 진입
        if [ -s raw_patch.txt ]; then
          echo "[+] 신규 자산 식별 및 구글 도킹 + Wayback 정찰을 시작합니다."
          
          REPORT_FILE="New_Subdomains_Report.txt"
          
          echo "========= 🚀 종합 자산 식별 리포트 =========" > $REPORT_FILE
          echo "스캔 일시: $(date)" >> $REPORT_FILE
          echo "============================================" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          while IFS= read -r root_domain || [ -n "$root_domain" ]; do
            root_domain=$(echo "$root_domain" | tr -d '\r' | xargs)
            [ -z "$root_domain" ] && continue
            
            grep -E "\.${root_domain}$|^${root_domain}$" raw_patch.txt | sort > temp_group.txt || true
            
            if [ -s temp_group.txt ]; then
              echo "📌 [Root: $root_domain]" >> $REPORT_FILE
              echo "--------------------------------------------" >> $REPORT_FILE
              
              # A. 구글 도킹 수집 및 에러 방지 처리 (|| true)
              katana -u "$root_domain" -passive -silent -field url \
                | grep -Ei "\.(env|log|bak|sql|ini|git|conf|zip|tar|gz|yaml|yml|old|bkp|pwd)$|dashboard|admin|login|portal|config|swagger|api-docs|index-of" \
                | grep -Eiv "\.(png|jpg|jpeg|gif|css|js|woff|woff2|svg|ico|font)$" \
                | sort -u > temp_all_dorks.txt || true
              
              # B. Waybackurls 수집 및 에러 방지 처리 (|| true)
              echo "$root_domain" | waybackurls \
                | grep -Ei "\.(env|log|bak|sql|ini|git|conf|zip|tar|gz|yaml|yml|old|bkp|pwd)$|dashboard|admin|login|portal|config|swagger|api-docs|index-of" \
                | grep -Eiv "\.(png|jpg|jpeg|gif|css|js|woff|woff2|svg|ico|font)$" \
                | sort -u > temp_all_wayback.txt || true
              
              # 서브도메인별 매칭 루프
              while IFS= read -r sub_domain || [ -n "$sub_domain" ]; do
                sub_domain=$(echo "$sub_domain" | xargs)
                [ -z "$sub_domain" ] && continue
                
                # 메인 주소 응답코드 확인
                echo "🌐 $(echo "$sub_domain" | httpx -sc -silent -t 10 -timeout 3 -retries 0 | sed 's/\x1b\[[0-9;]*m//g')" >> $REPORT_FILE
                
                # ① 구글 도킹 결과 매칭 검증
                if [ -s temp_all_dorks.txt ]; then
                  grep -i "$sub_domain" temp_all_dorks.txt > temp_sub_dorks.txt || true
                  if [ -s temp_sub_dorks.txt ]; then
                    cat temp_sub_dorks.txt \
                      | httpx -sc -silent -t 10 -timeout 3 -retries 0 \
                      | sed 's/\x1b\[[0-9;]*m//g' \
                      | while read -r validated_dork; do
                        echo "   ↳ 🔍 Dork: $validated_dork" >> $REPORT_FILE
                      done || true
                  fi
                  rm -f temp_sub_dorks.txt
                fi
                
                # ② Waybackurls 결과 매칭 검증
                if [ -s temp_all_wayback.txt ]; then
                  grep -i "$sub_domain" temp_all_wayback.txt > temp_sub_wayback.txt || true
                  if [ -s temp_sub_wayback.txt ]; then
                    cat temp_sub_wayback.txt \
                      | httpx -sc -silent -t 10 -timeout 3 -retries 0 \
                      | sed 's/\x1b\[[0-9;]*m//g' \
                      | while read -r validated_wayback; do
                        echo "   ↳ ⏳ Wayback: $validated_wayback" >> $REPORT_FILE
                      done || true
                  fi
                  rm -f temp_sub_wayback.txt
                fi
                
                echo "" >> $REPORT_FILE
              done < temp_group.txt
              
              echo "============================================" >> $REPORT_FILE
              echo "" >> $REPORT_FILE
            fi
            
            # 루프가 끝날 때마다 안전하게 초기화
            echo "" > temp_all_dorks.txt
            echo "" > temp_all_wayback.txt
          done < targets.txt
          
          # 3. 디스코드 API로 완벽하게 전송
          curl -H "Content-Type: multipart/form-data" \
               -F "content=🔥 **[Subdomain Monitor]** 정기 스캔 완료! 구글 도킹과 Wayback 아카이브 교차 검증 리포트가 배달되었습니다." \
               -F "file=@./$REPORT_FILE" \
               "$DISCORD_URL"
               
          rm -f $REPORT_FILE
        else
          echo "[-] 새로 발견된 서브도메인이 없습니다."
          echo "🔍 **[Subdomain Monitor]** 새로운 서브도메인이 발견되지 않았습니다. (정상 작동 중)" | notify -silent
        fi
        
        # 최종 파일 청소
        rm -f raw_patch.txt temp_group.txt temp_all_dorks.txt temp_all_wayback.txt
        
    - name: Commit & Push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add domains_old.txt
        git commit -m "Update domains_old.txt [skip ci]" || echo "No changes to commit"
        git push
